<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hotel Details</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/layout.css">

</head>

<body>

<header>

    <h1>Hotel Booking</h1>

    <nav>
        <a href="index.html">Hotels</a>
        <a href="bookings.html">My Bookings</a>
    </nav>

</header>


<div class="container">

    <!-- Hotel Details -->

    <div id="hotelDetails">

        <h1 id="hotelName">
            Loading hotel...
        </h1>

        <p id="hotelLocation"></p>

        <p id="hotelRating"></p>

        <p id="hotelPrice"></p>

        <p id="hotelAmenities"></p>

    </div>


    <!-- Available Rooms -->

    <h1>Available Rooms</h1>

    <div class="booking-box">

        <h2>Book Room</h2>


        <label for="roomSelect">
            Select Room
        </label>

        <select id="roomSelect" required>

            <option value="">
                Select a room
            </option>

        </select>


        <label for="checkIn">
            Check-in
        </label>

        <input
            type="date"
            id="checkIn"
            required
        >


        <label for="checkOut">
            Check-out
        </label>

        <input
            type="date"
            id="checkOut"
            required
        >


        <label for="guests">
            Guests
        </label>

        <input
            type="number"
            id="guests"
            min="1"
            value="1"
            required
        >


        <button id="bookBtn">
            Book Room
        </button>

    </div>

</div>


<script>

const API_URL = "http://localhost:3000";


// Get hotel ID from URL
const params = new URLSearchParams(
    window.location.search
);

const hotelId = params.get("id");


// Load hotel
async function loadHotel() {

    try {

        const response =
            await fetch(`${API_URL}/hotels/${hotelId}`);

        const hotel =
            await response.json();


        document.getElementById("hotelName")
            .textContent = hotel.name;

        document.getElementById("hotelLocation")
            .textContent =
            "Location: " + hotel.location;

        document.getElementById("hotelRating")
            .textContent =
            "⭐ " + hotel.rating;

        document.getElementById("hotelPrice")
            .textContent =
            "₹" + hotel.price + " / night";

        document.getElementById("hotelAmenities")
            .textContent =
            "Amenities: " +
            hotel.amenities.join(", ");


        loadRooms(hotelId);

    }

    catch(error) {

        console.error(error);

        document.getElementById("hotelName")
            .textContent =
            "Unable to load hotel";

    }

}


// Load rooms
async function loadRooms(hotelId) {

    try {

        const response =
            await fetch(
                `${API_URL}/rooms?hotelId=${hotelId}`
            );

        const rooms =
            await response.json();


        const roomSelect =
            document.getElementById("roomSelect");


        roomSelect.innerHTML = `
            <option value="">
                Select a room
            </option>
        `;


        rooms.forEach(function(room) {

            if (room.status === "available") {

                roomSelect.innerHTML += `

                    <option value="${room.id}">

                        Room ${room.roomNumber}
                        -
                        ${room.roomType}
                        -
                        ₹${room.price}

                    </option>

                `;

            }

        });


        console.log("Rooms loaded:", rooms);

    }

    catch(error) {

        console.error(
            "Error loading rooms:",
            error
        );

    }

}


// Book room
document.getElementById("bookBtn")
    .addEventListener("click", async function() {

        const roomId =
            document.getElementById("roomSelect").value;

        const checkIn =
            document.getElementById("checkIn").value;

        const checkOut =
            document.getElementById("checkOut").value;

        const guests =
            document.getElementById("guests").value;


        if (!roomId) {

            alert("Please select a room.");

            return;

        }


        if (!checkIn || !checkOut) {

            alert("Please select check-in and check-out dates.");

            return;

        }


        const booking = {

            id: "B" + Date.now(),

            userId: "U001",

            hotelId: hotelId,

            roomId: roomId,

            checkIn: checkIn,

            checkOut: checkOut,

            guests: Number(guests),

            totalAmount: 0,

            status: "confirmed"

        };


        try {

            const response =
                await fetch(`${API_URL}/bookings`, {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify(booking)

                });


            if (response.ok) {

                alert(
                    "Room booked successfully!"
                );

            }

        }

        catch(error) {

            console.error(error);

            alert("Booking failed.");

        }

    });


// Start
if (hotelId) {

    loadHotel();

}
else {

    document.getElementById("hotelName")
        .textContent =
        "Hotel ID not found";

}

</script>

</body>

</html>
